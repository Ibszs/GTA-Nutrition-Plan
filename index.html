<!doctype html>
<html lang="en-CA" data-room="street" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forme</title>
<meta name="description" content="Forme: your training, kitchen, movement practice and daily habits. Everything stays on this device.">
<meta name="theme-color" content="#131012">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="assets/fonts/sofia-sans-extra-condensed-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sofia-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/css/base.css">
<link rel="stylesheet" href="app/css/rooms.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app" id="app">
  <div class="ambience" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="topbar" id="topbar">
    <a class="wordmark" href="#/today" aria-label="Forme, go to Today">Forme</a>
    <span class="topbar__where" id="where">Today</span>
    <span class="topbar__spacer"></span>
    <a class="stamp" id="stampLink" href="#/fun/sheet" aria-label="Open this month"></a>
    <a class="icon-btn" id="privateLink" href="#/private?log" aria-label="Private" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#eye"/></svg></a>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to light appearance"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#sun"/></svg></button>
    <a class="icon-btn" href="#/search" aria-label="Search Forme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#search"/></svg></a>
    <a class="icon-btn" href="#/you" aria-label="You: goals, progress and settings"><span class="avatar" id="avatar">F</span></a>
  </header>
  <main class="view" id="view" tabindex="-1">
    <div class="wrap"><div class="leader" role="status" aria-label="Loading Forme"></div></div>
  </main>
  <nav class="dock" aria-label="Main">
    <a class="dock__item" href="#/today" data-nav="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#house"/></svg><span>Today</span></a>
    <a class="dock__item" href="#/train" data-nav="train"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#dumbbell"/></svg><span>Train</span></a>
    <button class="dock__rec" type="button" id="recButton" aria-label="Quick add: log something now"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#plus"/></svg></button>
    <a class="dock__item" href="#/eat" data-nav="eat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#utensils-crossed"/></svg><span>Eat</span></a>
    <a class="dock__item" href="#/move" data-nav="move"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons.svg#figure"/></svg><span>Move</span></a>
  </nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</div>
<noscript><p style="padding:24px;color:#fdecef;font-family:system-ui">Forme needs JavaScript to run. Your saved journals are untouched.</p></noscript>
<script type="module" src="app/main.js"></script>
</body>
</html>
